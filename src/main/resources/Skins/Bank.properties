@baseTheme = dark

@navy        = #0b1f3a
@gold        = #d4af37
@paper       = #f4f6fb
@ink         = #0b1f3a
@navyLight   = lighten(@navy, 9%)
@goldLight   = lighten(@gold, 22%)
@goldDark    = darken(@gold, 18%)
@ok          = #1f9d55
@warn        = #f0a500
@danger      = #d64545

@background          = @navy
@foreground          = #eef2f8
@accentColor         = @gold
@selectionBackground = @gold
@selectionForeground = contrast(@gold, @ink, #ffffff)
@buttonBackground    = @navyLight
@componentBackground = @navyLight

Component.arc            = 8
Button.arc               = 8
TextComponent.arc        = 8
Component.focusWidth     = 1
Component.innerFocusWidth = 0
Component.borderColor    = fade(@gold, 55%)
Component.arrowType      = chevron
Button.shadowWidth       = 2
Button.shadowColor       = fade(#000000, 35%)

Button.startBackground   = @goldLight
Button.endBackground     = @gold
Button.foreground        = #000000
Button.hoverBackground   = lighten(@gold, 26%)
Button.pressedBackground = @goldDark

ScrollBar.width        = 12
ScrollBar.thumbArc     = 999
ScrollBar.trackArc     = 999
ScrollBar.showButtons  = false
ScrollBar.thumb        = @goldDark
ScrollBar.hoverThumbColor = @gold

Table.background          = @paper
Table.foreground          = @ink
Table.alternateRowColor   = darken(@paper, 4%)
Table.gridColor           = darken(@paper, 12%)
Table.showHorizontalLines = true
Table.showVerticalLines   = false
Table.rowHeight           = 26
TableHeader.background          = @gold
TableHeader.foreground          = @ink
TableHeader.separatorColor      = @goldDark
TableHeader.bottomSeparatorColor = @goldDark

[style]Button.dashBut = \
    foreground: #000000; \
    borderColor: @goldDark; \
    borderWidth: 2; \
    arc: 10; \
    shadowWidth: 4

[style]Button.mgrAdd = \
    background: @ok; \
    foreground: #ffffff; \
    hoverBackground: lighten(@ok, 8%); \
    pressedBackground: darken(@ok, 10%); \
    borderColor: lighten(@ok, 18%); \
    borderWidth: 2; \
    arc: 12

[style]Button.mgrQS = \
    background: @warn; \
    foreground: #1a1200; \
    hoverBackground: lighten(@warn, 8%); \
    pressedBackground: darken(@warn, 10%); \
    borderColor: lighten(@warn, 18%); \
    borderWidth: 2; \
    arc: 12

[style]Button.mgrDelS = \
    background: @danger; \
    foreground: #ffffff; \
    hoverBackground: lighten(@danger, 8%); \
    pressedBackground: darken(@danger, 10%); \
    borderColor: lighten(@danger, 18%); \
    borderWidth: 2; \
    arc: 12

[style]Panel.queuePanel = \
    background: @paper; \
    border: 8,10,8,10,@gold,3,14; \
    arc: 14

[style]Label.queueText = \
    foreground: @ink

[style]Label.inqueueText = \
    foreground: @goldLight

[style]TextField.loginBar = \
    background: @paper; \
    foreground: @ink; \
    caretColor: @navy; \
    borderColor: @goldDark; \
    focusedBorderColor: @gold; \
    borderWidth: 2

[style]PasswordField.loginBar = \
    background: @paper; \
    foreground: @ink; \
    caretColor: @navy; \
    borderColor: @goldDark; \
    focusedBorderColor: @gold; \
    borderWidth: 2

[style]Label.title = \
    foreground: @goldLight

[style]Table.mgrTab = \
    selectionBackground: @goldLight; \
    selectionForeground: #000000

[style]ScrollPane.mgrTab = \
    border: 2,2,2,2,@gold,2,10

[style]Label.queueNumber = \
    foreground: @navy

[style]Label.ticket = \
    foreground: @ink; \
    border: 2,2,2,2,@gold,2,0

[style]Label.clock = \
    foreground: @goldLight

[style]Button.loginBut = \
    foreground: #000000; \
    borderColor: @goldDark; \
    borderWidth: 2; \
    arc: 12

[style]Button.menuBut = \
    foreground: @gold; \
    background: @navyLight; \
    hoverBackground: lighten(@navyLight, 8%); \
    borderColor: @gold; \
    borderWidth: 1; \
    arc: 12
