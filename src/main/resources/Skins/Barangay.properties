@baseTheme = dark

@blue        = rgb(0, 56, 168)
@blueDeep    = changeLightness(@blue, 17%)
@red         = rgb(206, 17, 38)
@sun         = rgb(252, 209, 22)
@sunDeep     = darken(saturate(@sun, 8%), 12%)
@paper       = #ffffff
@ink         = #0a1a44
@okGreen     = #1b8a3a
@warn        = @sun
@danger      = @red

@background          = @blueDeep
@foreground          = #ffffff
@accentColor         = @sun
@selectionBackground = @sun
@selectionForeground = #000000
@buttonBackground    = lighten(@blueDeep, 8%)
@componentBackground = lighten(@blueDeep, 6%)

Component.arc             = 3
Button.arc                = 3
TextComponent.arc         = 3
Component.focusWidth      = 2
Component.innerFocusWidth = 0
Component.focusColor      = fadeout(@sun, 25%)
Component.borderColor     = fade(@sun, 70%)
Component.arrowType       = triangle
Button.shadowWidth        = 3
Button.shadowColor        = rgba(0, 0, 0, 45%)

Button.startBackground    = lighten(@sun, 12%)
Button.endBackground      = @sunDeep
Button.foreground         = #000000
Button.hoverBackground    = lighten(@sun, 24%)
Button.pressedBackground  = @sunDeep

ScrollBar.width           = 14
ScrollBar.thumbArc        = 3
ScrollBar.trackArc        = 3
ScrollBar.showButtons     = true
ScrollBar.thumb           = @blue
ScrollBar.hoverThumbColor = lighten(@blue, 10%)

Table.background          = @paper
Table.foreground          = @ink
Table.alternateRowColor   = mix(@paper, @blue, 94%)
Table.gridColor           = mix(@paper, @blue, 78%)
Table.showHorizontalLines = true
Table.showVerticalLines   = true
Table.rowHeight           = 26
TableHeader.background           = @blue
TableHeader.foreground           = #ffffff
TableHeader.separatorColor       = @sun
TableHeader.bottomSeparatorColor = @red

[style]Button.dashBut = \
    foreground: #000000; \
    borderColor: @red; \
    borderWidth: 3; \
    arc: 4; \
    shadowWidth: 5

[style]Button.mgrAdd = \
    background: @okGreen; \
    foreground: #ffffff; \
    hoverBackground: lighten(@okGreen, 8%); \
    pressedBackground: darken(@okGreen, 8%); \
    borderColor: @paper; \
    borderWidth: 2; \
    arc: 4

[style]Button.mgrQS = \
    background: @sun; \
    foreground: #000000; \
    hoverBackground: lighten(@sun, 12%); \
    pressedBackground: @sunDeep; \
    borderColor: @paper; \
    borderWidth: 2; \
    arc: 4

[style]Button.mgrDelS = \
    background: @red; \
    foreground: #ffffff; \
    hoverBackground: lighten(@red, 8%); \
    pressedBackground: darken(@red, 8%); \
    borderColor: @paper; \
    borderWidth: 2; \
    arc: 4

[style]Panel.queuePanel = \
    background: @paper; \
    border: 8,10,8,10,@red,4,6; \
    arc: 6

[style]Label.queueText = \
    foreground: @ink

[style]Label.inqueueText = \
    foreground: @sun

[style]TextField.loginBar = \
    background: @paper; \
    foreground: @ink; \
    caretColor: @blue; \
    borderColor: @sun; \
    focusedBorderColor: @red; \
    borderWidth: 2

[style]PasswordField.loginBar = \
    background: @paper; \
    foreground: @ink; \
    caretColor: @blue; \
    borderColor: @sun; \
    focusedBorderColor: @red; \
    borderWidth: 2

[style]Label.title = \
    foreground: @sun

[style]Table.mgrTab = \
    selectionBackground: lighten(@sun, 25%); \
    selectionForeground: #000000

[style]ScrollPane.mgrTab = \
    border: 3,3,3,3,@sun,3,0

[style]Label.queueNumber = \
    foreground: @blue

[style]Label.ticket = \
    foreground: @ink; \
    border: 2,2,2,2,@blue,2,0

[style]Label.clock = \
    foreground: @sun

[style]Button.loginBut = \
    foreground: #000000; \
    borderColor: @red; \
    borderWidth: 2; \
    arc: 4

[style]Button.menuBut = \
    foreground: @sun; \
    background: lighten(@blueDeep, 8%); \
    hoverBackground: lighten(@blueDeep, 16%); \
    borderColor: @sun; \
    borderWidth: 2; \
    arc: 4
