@baseTheme = light

@teal        = #0e9f93
@tealPale    = tint(@teal, 88%)
@tealSoft    = tint(@teal, 62%)
@tealDeep    = shade(@teal, 38%)
@mint        = mix(@teal, #ffffff, 22%)
@ok          = hsl(152, 62%, 38%)
@warn        = hsl(36, 92%, 52%)
@danger      = changeSaturation(hsl(356, 70%, 52%), 72%)
@paper       = #ffffff

@background          = @tealPale
@foreground          = @tealDeep
@accentColor         = @teal
@selectionBackground = @tealSoft
@selectionForeground = #06302c
@componentBackground = @paper
@buttonBackground    = @paper
@disabledForeground  = desaturate(tint(@tealDeep, 55%), 10%)

Component.arc             = 16
Button.arc                = 999
TextComponent.arc         = 999
Component.focusWidth      = 2
Component.innerFocusWidth = 0
Component.focusColor      = fade(@teal, 70%)
Component.borderColor     = @tealSoft
Component.arrowType       = chevron
Button.shadowWidth        = 0

Button.startBackground    = tint(@teal, 74%)
Button.endBackground      = tint(@teal, 50%)
Button.foreground         = @tealDeep
Button.hoverBackground    = tint(@teal, 36%)
Button.pressedBackground  = @mint

ScrollBar.width           = 10
ScrollBar.thumbArc        = 999
ScrollBar.trackArc        = 999
ScrollBar.showButtons     = false
ScrollBar.thumb           = @tealSoft
ScrollBar.hoverThumbColor = @teal

Table.background          = @paper
Table.foreground          = #0a2e2b
Table.alternateRowColor   = tint(@teal, 94%)
Table.gridColor           = tint(@teal, 80%)
Table.showHorizontalLines = true
Table.showVerticalLines   = false
Table.rowHeight           = 28
TableHeader.background           = @teal
TableHeader.foreground           = #ffffff
TableHeader.separatorColor       = shade(@teal, 14%)
TableHeader.bottomSeparatorColor = shade(@teal, 14%)

[style]Button.dashBut = \
    foreground: #000000; \
    borderColor: @teal; \
    borderWidth: 2; \
    arc: 40

[style]Button.mgrAdd = \
    background: @ok; \
    foreground: #ffffff; \
    hoverBackground: lighten(@ok, 7%); \
    pressedBackground: darken(@ok, 8%); \
    borderColor: lighten(@ok, 22%); \
    borderWidth: 3; \
    arc: 999

[style]Button.mgrQS = \
    background: @warn; \
    foreground: #2b1a00; \
    hoverBackground: lighten(@warn, 7%); \
    pressedBackground: darken(@warn, 8%); \
    borderColor: lighten(@warn, 22%); \
    borderWidth: 3; \
    arc: 999

[style]Button.mgrDelS = \
    background: @danger; \
    foreground: #ffffff; \
    hoverBackground: lighten(@danger, 7%); \
    pressedBackground: darken(@danger, 8%); \
    borderColor: lighten(@danger, 22%); \
    borderWidth: 3; \
    arc: 999

[style]Panel.queuePanel = \
    background: @paper; \
    border: 8,12,8,12,@teal,3,22; \
    arc: 22

[style]Label.queueText = \
    foreground: @tealDeep

[style]Label.inqueueText = \
    foreground: @tealDeep

[style]TextField.loginBar = \
    background: @paper; \
    foreground: #0a2e2b; \
    caretColor: @teal; \
    borderColor: @tealSoft; \
    focusedBorderColor: @teal; \
    borderWidth: 2; \
    arc: 999

[style]PasswordField.loginBar = \
    background: @paper; \
    foreground: #0a2e2b; \
    caretColor: @teal; \
    borderColor: @tealSoft; \
    focusedBorderColor: @teal; \
    borderWidth: 2; \
    arc: 999

[style]Label.title = \
    foreground: @tealDeep

[style]Table.mgrTab = \
    selectionBackground: @tealSoft; \
    selectionForeground: #06302c

[style]ScrollPane.mgrTab = \
    border: 2,2,2,2,@teal,2,12

[style]Label.queueNumber = \
    foreground: @teal; \
    font: bold 60 Monospaced

[style]Label.ticket = \
    foreground: @tealDeep; \
    border: 2,2,2,2,@tealSoft,2,0

[style]Label.clock = \
    foreground: @teal

[style]Button.loginBut = \
    background: @teal; \
    foreground: #ffffff; \
    hoverBackground: lighten(@teal, 8%); \
    pressedBackground: darken(@teal, 8%); \
    borderColor: lighten(@teal, 22%); \
    borderWidth: 2; \
    arc: 999

[style]Button.menuBut = \
    background: @paper; \
    foreground: @tealDeep; \
    hoverBackground: @tealSoft; \
    borderColor: @teal; \
    borderWidth: 1; \
    arc: 999
