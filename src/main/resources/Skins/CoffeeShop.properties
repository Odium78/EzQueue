@baseTheme = dark

@espresso    = #2a1b14
@caramel     = #c98a4b
@caramelLt   = tint(@caramel, 35%)
@caramelDk   = shade(@caramel, 28%)
@cream       = #f7eddc
@latte       = mix(@cream, @caramel, 78%)
@matcha      = desaturate(spin(@caramel, 95), 18%)
@matchaDk    = shade(@matcha, 20%)
@berry       = saturate(spin(@caramel, -28), 8%)
@honey       = #e3a72f

@background          = @espresso
@foreground          = @cream
@accentColor         = @caramel
@selectionBackground = @caramelLt
@selectionForeground = #2a1b14
@buttonBackground    = lighten(@espresso, 8%)
@componentBackground = lighten(@espresso, 6%)
@disabledForeground  = shade(@cream, 45%)

Component.arc             = 18
Button.arc                = 22
TextComponent.arc         = 22
Component.focusWidth      = 2
Component.innerFocusWidth = 0
Component.focusColor      = changeAlpha(@caramelLt, 65%)
Component.borderColor     = @caramelDk
Component.arrowType       = chevron
Button.shadowWidth        = 3
Button.shadowColor        = changeAlpha(#000000, 35%)

Button.startBackground    = @caramelLt
Button.endBackground      = @caramel
Button.foreground         = #1c110b
Button.hoverBackground    = tint(@caramel, 55%)
Button.pressedBackground  = @caramelDk

ScrollBar.width           = 12
ScrollBar.thumbArc        = 999
ScrollBar.trackArc        = 999
ScrollBar.showButtons     = false
ScrollBar.thumb           = @caramelDk
ScrollBar.hoverThumbColor = @caramel

Table.selectionInactiveBackground = darken(Table.selectionBackground, 8%, lazy)
Table.background          = @cream
Table.foreground          = #2a1b14
Table.alternateRowColor   = shade(@cream, 5%)
Table.gridColor           = shade(@cream, 14%)
Table.showHorizontalLines = true
Table.showVerticalLines   = false
Table.rowHeight           = 28
TableHeader.background           = @caramelDk
TableHeader.foreground           = @cream
TableHeader.separatorColor       = @caramel
TableHeader.bottomSeparatorColor = @caramel

[style]Button.dashBut = \
    foreground: #000000; \
    borderColor: @caramelDk; \
    borderWidth: 3; \
    arc: 28

[style]Button.mgrAdd = \
    background: @matcha; \
    foreground: #08140a; \
    hoverBackground: lighten(@matcha, 7%); \
    pressedBackground: @matchaDk; \
    borderColor: lighten(@matcha, 20%); \
    borderWidth: 3; \
    arc: 24

[style]Button.mgrQS = \
    background: @honey; \
    foreground: #2a1b14; \
    hoverBackground: lighten(@honey, 7%); \
    pressedBackground: darken(@honey, 10%); \
    borderColor: lighten(@honey, 20%); \
    borderWidth: 3; \
    arc: 24

[style]Button.mgrDelS = \
    background: @berry; \
    foreground: #ffffff; \
    hoverBackground: lighten(@berry, 7%); \
    pressedBackground: darken(@berry, 10%); \
    borderColor: lighten(@berry, 20%); \
    borderWidth: 3; \
    arc: 24

[style]Panel.queuePanel = \
    background: @cream; \
    border: 8,12,8,12,@caramel,4,26; \
    arc: 26

[style]Label.queueText = \
    foreground: @espresso

[style]Label.inqueueText = \
    foreground: @caramelLt

[style]TextField.loginBar = \
    background: @cream; \
    foreground: @espresso; \
    caretColor: @caramelDk; \
    borderColor: @caramel; \
    focusedBorderColor: @caramelLt; \
    borderWidth: 2; \
    arc: 22

[style]PasswordField.loginBar = \
    background: @cream; \
    foreground: @espresso; \
    caretColor: @caramelDk; \
    borderColor: @caramel; \
    focusedBorderColor: @caramelLt; \
    borderWidth: 2; \
    arc: 22

[style]Label.title = \
    foreground: @caramelLt

[style]Table.mgrTab = \
    selectionBackground: @caramelLt; \
    selectionForeground: #2a1b14

[style]ScrollPane.mgrTab = \
    border: 3,3,3,3,@caramel,3,16

[style]Label.queueNumber = \
    foreground: @caramelDk; \
    font: bold 60 Monospaced

[style]Label.ticket = \
    foreground: @espresso; \
    border: 2,2,2,2,@caramel,2,0

[style]Label.clock = \
    foreground: @caramelLt

[style]Button.loginBut = \
    foreground: #1c110b; \
    borderColor: @caramelDk; \
    borderWidth: 2; \
    arc: 24

[style]Button.menuBut = \
    foreground: @caramelLt; \
    background: lighten(@espresso, 8%); \
    hoverBackground: lighten(@espresso, 16%); \
    borderColor: @caramel; \
    borderWidth: 2; \
    arc: 24
