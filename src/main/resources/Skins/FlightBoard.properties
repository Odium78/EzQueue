@baseTheme = dark

@charcoal    = hsl(215, 22%, 8%)
@amber       = hsl(41, 100%, 50%)
@amberLight  = lighten(@amber, 14%)
@amberDeep   = changeLightness(@amber, 36%)
@led         = changeHue(@amber, 148)
@ledGreen    = hsl(150, 70%, 42%)
@alert       = hsl(6, 90%, 58%)
@board       = @amber
@ink         = #000000
@cream       = hsl(44, 60%, 94%)

@background          = @charcoal
@foreground          = #f2f2f2
@accentColor         = @amber
@selectionBackground = @amber
@selectionForeground = #000000
@buttonBackground    = lighten(@charcoal, 9%)
@componentBackground = lighten(@charcoal, 6%)
@glow                = if(@accentColor, changeAlpha(@amber, 40%), #ffffff)

Component.arc             = 2
Button.arc                = 2
TextComponent.arc         = 2
Component.focusWidth      = 2
Component.innerFocusWidth = 0
Component.focusColor      = @glow
Component.borderColor     = changeAlpha(@amber, 60%)
Component.arrowType       = triangle
Button.shadowWidth        = 0

Button.startBackground    = @amberLight
Button.endBackground      = @amber
Button.foreground         = @ink
Button.hoverBackground    = lighten(@amber, 22%)
Button.pressedBackground  = @amberDeep

ScrollBar.width           = 10
ScrollBar.thumbArc        = 0
ScrollBar.trackArc        = 0
ScrollBar.showButtons     = false
ScrollBar.thumb           = @amberDeep
ScrollBar.hoverThumbColor = @amber

Table.background          = @cream
Table.foreground          = @ink
Table.alternateRowColor   = darken(@cream, 6%)
Table.gridColor           = darken(@cream, 14%)
Table.showHorizontalLines = true
Table.showVerticalLines   = true
Table.rowHeight           = 28
TableHeader.background           = #000000
TableHeader.foreground           = @amber
TableHeader.separatorColor       = @amberDeep
TableHeader.bottomSeparatorColor = @amber

[style]Button.dashBut = \
    foreground: #000000; \
    borderColor: @amberDeep; \
    borderWidth: 2; \
    arc: 0

[style]Button.mgrAdd = \
    background: @ledGreen; \
    foreground: #000000; \
    hoverBackground: lighten(@ledGreen, 8%); \
    pressedBackground: darken(@ledGreen, 8%); \
    borderColor: lighten(@ledGreen, 25%); \
    borderWidth: 2; \
    arc: 2

[style]Button.mgrQS = \
    background: @amber; \
    foreground: #000000; \
    hoverBackground: lighten(@amber, 10%); \
    pressedBackground: @amberDeep; \
    borderColor: lighten(@amber, 25%); \
    borderWidth: 2; \
    arc: 2

[style]Button.mgrDelS = \
    background: @alert; \
    foreground: #000000; \
    hoverBackground: lighten(@alert, 8%); \
    pressedBackground: darken(@alert, 8%); \
    borderColor: lighten(@alert, 25%); \
    borderWidth: 2; \
    arc: 2

[style]Panel.queuePanel = \
    background: @board; \
    border: 8,10,8,10,#000000,4,4; \
    arc: 4

[style]Label.queueText = \
    foreground: @ink

[style]Label.inqueueText = \
    foreground: @amber

[style]TextField.loginBar = \
    background: @cream; \
    foreground: @ink; \
    caretColor: #000000; \
    borderColor: @amberDeep; \
    focusedBorderColor: @amber; \
    borderWidth: 2

[style]PasswordField.loginBar = \
    background: @cream; \
    foreground: @ink; \
    caretColor: #000000; \
    borderColor: @amberDeep; \
    focusedBorderColor: @amber; \
    borderWidth: 2

[style]Label.title = \
    foreground: @amber

[style]Table.mgrTab = \
    selectionBackground: @amberLight; \
    selectionForeground: #000000

[style]ScrollPane.mgrTab = \
    border: 2,2,2,2,@amber,2,0

[style]Label.queueNumber = \
    foreground: #000000; \
    font: bold 60 Monospaced

[style]Label.ticket = \
    foreground: #000000; \
    font: bold 24 Monospaced; \
    border: 2,2,2,2,#000000,2,0

[style]Label.clock = \
    foreground: @amber; \
    font: bold 36 Monospaced

[style]Button.loginBut = \
    foreground: #000000; \
    borderColor: @amberDeep; \
    borderWidth: 2; \
    arc: 0

[style]Button.menuBut = \
    foreground: @amber; \
    background: lighten(@charcoal, 9%); \
    hoverBackground: lighten(@charcoal, 18%); \
    borderColor: @amber; \
    borderWidth: 1; \
    arc: 0
