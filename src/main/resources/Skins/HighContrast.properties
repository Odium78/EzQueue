@baseTheme = dark

@black       = #000000
@white       = #ffffff
@yellow      = #ffe600
@cyan        = #00e5ff
@green       = #00e676
@orange      = #ff9100
@red         = #ff3b30
@dark        = lighten(@black, 12%)

@background          = @black
@foreground          = @white
@accentColor         = @yellow
@selectionBackground = @yellow
@selectionForeground = contrast(@yellow, @black, @white)
@buttonBackground    = @dark
@componentBackground = @dark
@disabledForeground  = #9a9a9a

Component.arc             = 6
Button.arc                = 6
TextComponent.arc         = 6
Component.focusWidth      = 4
Component.innerFocusWidth = 1
Component.focusColor      = @cyan
Component.borderColor     = @white
Component.borderWidth     = 2
Component.arrowType       = triangle
Button.shadowWidth        = 0

Button.foreground         = @white
Button.hoverBackground    = lighten(@dark, 14%)
Button.pressedBackground  = lighten(@dark, 26%)

ScrollBar.width           = 20
ScrollBar.thumbArc        = 4
ScrollBar.trackArc        = 4
ScrollBar.showButtons     = true
ScrollBar.thumb           = @yellow
ScrollBar.hoverThumbColor = @cyan
ScrollBar.track           = @dark

Table.background          = @white
Table.foreground          = @black
Table.alternateRowColor   = #e4e4e4
Table.gridColor           = #000000
Table.showHorizontalLines = true
Table.showVerticalLines   = true
Table.rowHeight           = 32
TableHeader.background           = @yellow
TableHeader.foreground           = @black
TableHeader.separatorColor       = @black
TableHeader.bottomSeparatorColor = @black

[style]Button.dashBut = \
    background: @yellow; \
    foreground: @black; \
    hoverBackground: lighten(@yellow, 12%); \
    pressedBackground: darken(@yellow, 14%); \
    borderColor: @white; \
    borderWidth: 4; \
    arc: 8

[style]Button.mgrAdd = \
    background: @green; \
    foreground: contrast(@green, @black, @white); \
    hoverBackground: lighten(@green, 10%); \
    pressedBackground: darken(@green, 12%); \
    borderColor: @white; \
    borderWidth: 3; \
    arc: 8

[style]Button.mgrQS = \
    background: @orange; \
    foreground: contrast(@orange, @black, @white); \
    hoverBackground: lighten(@orange, 10%); \
    pressedBackground: darken(@orange, 12%); \
    borderColor: @white; \
    borderWidth: 3; \
    arc: 8

[style]Button.mgrDelS = \
    background: @red; \
    foreground: contrast(@red, @black, @white); \
    hoverBackground: lighten(@red, 10%); \
    pressedBackground: darken(@red, 12%); \
    borderColor: @white; \
    borderWidth: 3; \
    arc: 8

[style]Panel.queuePanel = \
    background: @white; \
    border: 8,10,8,10,@yellow,6,8; \
    arc: 8

[style]Label.queueText = \
    foreground: @black

[style]Label.inqueueText = \
    foreground: @yellow

[style]TextField.loginBar = \
    background: @white; \
    foreground: @black; \
    caretColor: @black; \
    borderColor: @yellow; \
    focusedBorderColor: @cyan; \
    borderWidth: 3

[style]PasswordField.loginBar = \
    background: @white; \
    foreground: @black; \
    caretColor: @black; \
    borderColor: @yellow; \
    focusedBorderColor: @cyan; \
    borderWidth: 3

[style]Label.title = \
    foreground: @yellow

[style]Table.mgrTab = \
    selectionBackground: @cyan; \
    selectionForeground: @black

[style]ScrollPane.mgrTab = \
    border: 3,3,3,3,@yellow,3,0

[style]Label.queueNumber = \
    foreground: @black

[style]Label.ticket = \
    foreground: @black; \
    border: 2,2,2,2,@black,3,0

[style]Label.clock = \
    foreground: @yellow

[style]Button.loginBut = \
    background: @yellow; \
    foreground: @black; \
    hoverBackground: lighten(@yellow, 12%); \
    pressedBackground: darken(@yellow, 14%); \
    borderColor: @white; \
    borderWidth: 2; \
    margin: 2,6,2,6; \
    arc: 8

[style]Button.menuBut = \
    background: @dark; \
    foreground: @yellow; \
    hoverBackground: lighten(@dark, 14%); \
    borderColor: @yellow; \
    borderWidth: 2; \
    margin: 2,6,2,6; \
    arc: 8
